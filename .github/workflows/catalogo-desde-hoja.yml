name: Catálogo desde la hoja

# Lee la hoja de cálculo del catálogo (CSV), trae de R2 las fotos nuevas, valida, regenera las páginas y
# publica en main. Si un dato es inválido NO publica nada: la ejecución falla y GitHub avisa por correo
# con la lista de errores (fila y motivo) en el resumen.
#
# Configuración (Settings > Secrets and variables > Actions):
#   Variable  HOJA_CSV_URL   enlace de exportación CSV de la hoja
#   Secretos  R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET  (token de SOLO LECTURA)
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogo-desde-hoja
  cancel-in-progress: false

jobs:
  sincronizar:
    if: vars.HOJA_CSV_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publicado: ${{ steps.publicar.outputs.publicado }}
    steps:
      - uses: actions/checkout@v4

      - name: Leer la hoja
        id: hoja
        env:
          HOJA_CSV_URL: ${{ vars.HOJA_CSV_URL }}
        run: |
          curl -fsSL --retry 3 "$HOJA_CSV_URL" -o "$RUNNER_TEMP/hoja.csv"
          python3 scripts/hoja_catalogo.py faltantes "$RUNNER_TEMP/hoja.csv" > "$RUNNER_TEMP/faltan.txt"
          echo "faltan=$(wc -l < "$RUNNER_TEMP/faltan.txt")" >> "$GITHUB_OUTPUT"
          python3 scripts/hoja_catalogo.py videos "$RUNNER_TEMP/hoja.csv" > "$RUNNER_TEMP/videos.txt"
          echo "videos=$(wc -l < "$RUNNER_TEMP/videos.txt")" >> "$GITHUB_OUTPUT"

      - name: Traer de R2 los videos nuevos
        if: steps.hoja.outputs.videos != '0'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # Se publican tal cual (sin recomprimir). Máximo 25 MB por video para no inflar el repositorio.
          E="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com/$R2_BUCKET/fuentes"
          mkdir -p assets/video
          fallos=""
          while IFS= read -r nombre; do
            clave=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$nombre")
            if ! curl -fsS --aws-sigv4 "aws:amz:auto:s3" --user "$R2_ACCESS_KEY_ID:$R2_SECRET_ACCESS_KEY" \
                 -o "assets/video/$nombre" "$E/$clave" 2>/dev/null; then
              rm -f "assets/video/$nombre"; fallos="$fallos\n- $nombre: no está en R2 (carpeta fuentes/)"; continue
            fi
            mb=$(( $(stat -c%s "assets/video/$nombre") / 1048576 ))
            if [ "$mb" -gt 25 ]; then
              rm -f "assets/video/$nombre"; fallos="$fallos\n- $nombre: pesa ${mb} MB (máximo 25 MB)"; continue
            fi
            echo "Video añadido: $nombre (${mb} MB)"
          done < "$RUNNER_TEMP/videos.txt"
          if [ -n "$fallos" ]; then
            printf "### Videos con problemas (no se publicó nada)%b\n" "$fallos" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Hay videos que no se pudieron traer de R2; revisa el resumen."
            exit 1
          fi

      - name: Traer de R2 las fotos nuevas y optimizarlas
        if: steps.hoja.outputs.faltan != '0'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p fuentes
          E="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com/$R2_BUCKET/fuentes"
          sin_foto=""
          while IFS= read -r nombre; do
            clave=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$nombre")
            ok=""
            for ext in png jpg jpeg webp PNG JPG JPEG WEBP; do
              if curl -fsS --aws-sigv4 "aws:amz:auto:s3" --user "$R2_ACCESS_KEY_ID:$R2_SECRET_ACCESS_KEY" \
                   -o "fuentes/$nombre.$ext" "$E/$clave.$ext" 2>/dev/null; then ok=1; break; fi
              rm -f "fuentes/$nombre.$ext"
            done
            [ -n "$ok" ] && echo "Foto encontrada en R2: $nombre" || sin_foto="$sin_foto $nombre"
          done < "$RUNNER_TEMP/faltan.txt"
          if [ -n "$sin_foto" ]; then
            echo "::error::Estas fotos no están en R2 (carpeta fuentes/):$sin_foto"
            { echo "### Fotos que faltan en R2 (fuentes/)"; for n in $sin_foto; do echo "- $n"; done; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          npm install --no-save --no-package-lock sharp@0.34.5
          node scripts/optimize_images.cjs --fuentes fuentes

      - name: Importar y validar los datos
        run: |
          set -o pipefail
          python3 scripts/hoja_catalogo.py importar "$RUNNER_TEMP/hoja.csv" | tee "$RUNNER_TEMP/importar.txt" || {
            { echo "### La hoja tiene errores (no se publicó nada)"; echo '```'; cat "$RUNNER_TEMP/importar.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Quitar fotos y videos que ya no usa ningún producto
        run: python3 scripts/hoja_catalogo.py limpiar --aplicar | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Regenerar páginas
        run: python3 scripts/build_product_pages.py

      - name: Publicar
        id: publicar
        run: |
          rm -rf fuentes
          if [ -z "$(git status --porcelain)" ]; then
            echo "Sin cambios en la hoja." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "Catálogo S3D (hoja)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "catálogo: cambios desde la hoja de cálculo"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
          echo "publicado=true" >> "$GITHUB_OUTPUT"
          { echo "### Publicado"; git show --stat --format='%h %s' HEAD | head -40; } >> "$GITHUB_STEP_SUMMARY"

  # Un push hecho con GITHUB_TOKEN no dispara otros flujos: se despliega aquí mismo.
  desplegar:
    needs: sincronizar
    if: needs.sincronizar.outputs.publicado == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publicar.yml
